services:
  lab:
    image: cnsoist/steps:5.1.0
    build: recipe
    hostname: ${HOST:-steps}
    ports:
    - "8888:8888"
    env_file: .env
    entrypoint: [/usr/bin/entrypoint]
    command:
    - jupyter
    - lab
    - --no-browser
    - --allow-root
    - --ip=0.0.0.0
    - --notebook-dir=/opt/src/notebooks
    volumes:
    - ./notebooks:/opt/src/notebooks
    scale: 1
