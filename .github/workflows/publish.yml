# Builds and publishes the multi-architecture cnsoist/steps image.
#
# Push a tag named after the STEPS release (e.g. `5.1.0`) to publish it. Pull
# requests touching the recipe build and test both architectures without
# publishing anything, and the workflow can also be run manually.
#
# Publishing needs two repository secrets, DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN, holding a token with write access to the `cnsoist` namespace.
name: Publish Docker image

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    # Only what changes the image. Editing the workflow itself does not rebuild
    # it; rehearse those changes with a manual run against cnsoist/steps-testing.
    paths:
      - recipe/**
      - .github/smoke.py
  workflow_dispatch:
    inputs:
      steps_version:
        description: STEPS git tag to build
        required: true
      image:
        description: Docker Hub repository to push to
        default: cnsoist/steps-testing
      push:
        description: Push to Docker Hub (otherwise build and test only)
        type: boolean
        default: false

env:
  IMAGE: ${{ inputs.image || 'cnsoist/steps' }}
  # On a tag push the tag names the STEPS release to build. Pull requests build
  # whatever STEPS_VERSION the recipe already defaults to.
  VERSION: ${{ inputs.steps_version || (github.event_name == 'push' && github.ref_name) || '' }}
  # Only a tag push, or a manual run that asks for it, publishes anything.
  PUSH: ${{ github.event_name == 'push' || inputs.push }}

jobs:
  build:
    # One native runner per architecture. Building arm64 under QEMU emulation
    # takes longer than the 6h job limit allows.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        # Conda, gmsh, Omega_h and STEPS together need more than the ~14GB the
        # runner image leaves free.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Build
        run: |
          docker build ${VERSION:+--build-arg STEPS_VERSION=$VERSION} -t steps:ci recipe

      - name: Smoke test
        run: |
          docker run --rm steps:ci python -c "import steps; steps._greet()"
          docker run --rm -v "$PWD/.github:/w:ro" -w /tmp steps:ci python /w/smoke.py
          docker run --rm steps:ci mpirun --allow-run-as-root -n 2 \
            python -c "from mpi4py import MPI; print('rank', MPI.COMM_WORLD.Get_rank())"

      # Each architecture is published under its own tag; the manifest job below
      # combines them into the version and latest tags that users pull.
      - name: Push ${{ matrix.arch }} image
        if: env.PUSH == 'true'
        run: |
          echo '${{ secrets.DOCKERHUB_TOKEN }}' \
            | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin
          docker tag steps:ci "$IMAGE:$VERSION-${{ matrix.arch }}"
          docker push "$IMAGE:$VERSION-${{ matrix.arch }}"

  manifest:
    needs: build
    if: github.event_name == 'push' || inputs.push
    runs-on: ubuntu-24.04
    steps:
      - name: Combine both architectures into one tag
        run: |
          echo '${{ secrets.DOCKERHUB_TOKEN }}' \
            | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - uses: actions/checkout@v4

      # The Docker Hub description is a separate copy of the README that nothing
      # kept in sync, which is how it drifted several years behind.
      - name: Sync the Docker Hub description from README.md
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 .github/sync_hub_description.py "$IMAGE"
